[project]
name = "mcp-silverbullet"
version = "0.1.0"
description = "Model Context Protocol bridge between SilverBullet and MCP clients (e.g. Grok on the web)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [
  { name = "mcp-silverbullet authors" },
]
dependencies = [
  # MCP SDK — pinned exactly per the prior map's T1 decision (transport = Streamable HTTP, stateless).
  "mcp==2.1.1",
  # httpx2 is the rename of httpx under the pydantic org; it is what MCP SDK 2.x depends on.
  # The prior map's notes mentioned "httpx>=0.27"; that referred to the pre-rename package.
  # sb_client.py (T3) imports from this.
  "httpx2>=2.5.0",
  # Starlette + uvicorn are pulled in transitively by mcp==2.1.1, but we list them directly so the
  # bridge server has an explicit runtime contract.
  "starlette>=0.48.0",
  "uvicorn>=0.31.1",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  # respx lets us mock httpx transports in Layer 3 tests (no real SB needed).
  "respx>=0.21",
]

[project.scripts]
mcp-silverbullet = "mcp_silverbullet.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_silverbullet"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]